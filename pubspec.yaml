name: mensajeria_911_driver
description: App de los domiciliarios de Mensajeros Montería 911 (Android y PWA para iPhone).
publish_to: none
version: 1.1.21+26

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  firebase_core: ^3.14.0
  firebase_messaging: ^15.2.7
  flutter_local_notifications: ^19.3.0
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.4
  audioplayers: ^6.1.0
  google_fonts: ^6.2.1
  geolocator: ^13.0.2
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
